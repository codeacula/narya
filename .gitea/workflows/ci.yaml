name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bare names resolve against the Gitea DEFAULT_ACTIONS_URL, which has no
      # "setup-bun" clone — the canonical repo lives under the oven-sh org.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # build runs typecheck first; test covers the suite. The two live-Redis
      # smoke tests skip without a Redis, same as a laptop run.
      - run: bun run build
      - run: bun test
