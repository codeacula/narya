name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # build runs typecheck first; test covers the suite. The two live-Redis
      # smoke tests skip without a Redis, same as a laptop run.
      - run: bun run build
      - run: bun test
